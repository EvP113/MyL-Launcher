<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="icon-face-top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#242634"/>
      <stop offset="100%" stop-color="#14151f"/>
    </linearGradient>

    <linearGradient id="icon-face-left" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#191a24"/>
      <stop offset="100%" stop-color="#0c0d13"/>
    </linearGradient>

    <linearGradient id="icon-face-right" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1d29"/>
      <stop offset="100%" stop-color="#0f1017"/>
    </linearGradient>

    <linearGradient id="icon-glow-orange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5E36"/>
      <stop offset="100%" stop-color="#FFAE33"/>
    </linearGradient>

    <linearGradient id="icon-glow-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="100%" stop-color="#4FACFE"/>
    </linearGradient>

    <linearGradient id="icon-glow-green" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38EF7D"/>
      <stop offset="100%" stop-color="#11998E"/>
    </linearGradient>
  </defs>

  <g transform="translate(0, 0)">
    <!-- Top Face -->
    <polygon points="128,40 216,90 128,140 40,90" fill="url(#icon-face-top)"/>

    <!-- Left Face -->
    <polygon points="40,90 128,140 128,224 40,174" fill="url(#icon-face-left)"/>

    <!-- Right Face -->
    <polygon points="128,140 216,90 216,174 128,224" fill="url(#icon-face-right)"/>

    <!-- Center Y-Seam Glowing Accents -->
    <line x1="128" y1="140" x2="40" y2="90" stroke="url(#icon-glow-orange)" stroke-width="4.5" stroke-linecap="round"/>
    <line x1="128" y1="140" x2="216" y2="90" stroke="url(#icon-glow-cyan)" stroke-width="4.5" stroke-linecap="round"/>
    <line x1="128" y1="140" x2="128" y2="224" stroke="url(#icon-glow-green)" stroke-width="4.5" stroke-linecap="round"/>

    <!-- Center Node Glow -->
    <circle cx="128" cy="140" r="3" fill="#FFFFFF"/>
  </g>
</svg>
