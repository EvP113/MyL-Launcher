<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Card Background Shadow & Gradient -->
    <filter id="card-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.35"/>
    </filter>

    <linearGradient id="card-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F3F4F6"/>
    </linearGradient>

    <!-- Cube Face Gradients -->
    <linearGradient id="face-top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#242634"/>
      <stop offset="100%" stop-color="#14151f"/>
    </linearGradient>

    <linearGradient id="face-left" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#191a24"/>
      <stop offset="100%" stop-color="#0c0d13"/>
    </linearGradient>

    <linearGradient id="face-right" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1d29"/>
      <stop offset="100%" stop-color="#0f1017"/>
    </linearGradient>

    <!-- Glowing Accent Gradients for the Y-seams -->
    <linearGradient id="glow-orange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5E36"/>
      <stop offset="100%" stop-color="#FFAE33"/>
    </linearGradient>

    <linearGradient id="glow-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="100%" stop-color="#4FACFE"/>
    </linearGradient>

    <linearGradient id="glow-green" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38EF7D"/>
      <stop offset="100%" stop-color="#11998E"/>
    </linearGradient>
  </defs>

  <!-- Squircle White Card Container -->
  <rect x="40" y="40" width="432" height="432" rx="108" ry="108" fill="url(#card-bg)" filter="url(#card-shadow)"/>

  <!-- 3D Isometric Cube Container (Centered) -->
  <g id="cube" transform="translate(0, 0)">
    <!-- Top Face -->
    <polygon points="256,140 366,203 256,266 146,203" fill="url(#face-top)"/>

    <!-- Left Face -->
    <polygon points="146,203 256,266 256,372 146,309" fill="url(#face-left)"/>

    <!-- Right Face -->
    <polygon points="256,266 366,203 366,309 256,372" fill="url(#face-right)"/>

    <!-- Outer Cube Outline Edge Softening -->
    <polygon points="256,140 366,203 366,309 256,372 146,309 146,203" fill="none" stroke="#000000" stroke-opacity="0.1" stroke-width="4"/>

    <!-- Center Y-Seam Glowing Accents -->
    <!-- Top-Left Seam (Orange/Amber) -->
    <line x1="256" y1="266" x2="146" y2="203" stroke="url(#glow-orange)" stroke-width="6" stroke-linecap="round"/>
    
    <!-- Top-Right Seam (Cyan/Blue) -->
    <line x1="256" y1="266" x2="366" y2="203" stroke="url(#glow-cyan)" stroke-width="6" stroke-linecap="round"/>

    <!-- Bottom Vertical Seam (Bright Green/Teal) -->
    <line x1="256" y1="266" x2="256" y2="372" stroke="url(#glow-green)" stroke-width="6" stroke-linecap="round"/>

    <!-- Center Intersection Node Glow -->
    <circle cx="256" cy="266" r="4" fill="#FFFFFF"/>
  </g>
</svg>
