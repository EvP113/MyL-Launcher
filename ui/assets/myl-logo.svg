<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 84 24" width="252" height="72">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@700&amp;display=swap');
      .logo-text {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-size: 16px;
        font-weight: 700;
        fill: #ffffff;
      }
    </style>
  </defs>

  <!-- Фиолетовый скруглённый квадрат (24x24px, border-radius 4px) -->
  <rect x="0" y="0" width="24" height="24" rx="4" ry="4" fill="#6c5ce7"/>
  
  <!-- Точная векторная форма иконки deployed_code из Material Symbols (размер 14px, по центру) -->
  <g transform="translate(5, 5) scale(0.5833)">
    <path fill="#ffffff" d="M12 11.15 5.5 7.4 12 3.65 18.5 7.4 12 11.15ZM4.5 19.3V9.125l7 4.025V21.35l-7-4.05Zm15 0-7 4.05V13.15l7-4.025V19.3Z"/>
  </g>

  <!-- Текст MyL с отступом справа (gap-2 = 8px -> X: 32) -->
  <text x="32" y="17.5" class="logo-text">MyL</text>
</svg>
