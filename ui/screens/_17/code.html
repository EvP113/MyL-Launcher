<!-- Micro-interactions Script -->
<script>
        document.querySelectorAll('.export-option').forEach(option => {
            option.addEventListener('click', () => {
                // Update icons color for visual feedback
                document.querySelectorAll('.export-option span').forEach(s => {
                    s.classList.remove('text-primary');
                    s.classList.add('text-on-surface-variant');
                });
                const icon = option.querySelector('span');
                icon.classList.remove('text-on-surface-variant');
                icon.classList.add('text-primary');
            });
        });
    </script>
